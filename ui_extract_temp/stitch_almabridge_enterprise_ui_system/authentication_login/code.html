<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | AlmaBridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#f7b7ac",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#784840",
                    "on-primary-fixed": "#002019",
                    "on-error-container": "#93000a",
                    "inverse-primary": "#a0d1c0",
                    "on-surface-variant": "#404945",
                    "primary": "#154539",
                    "on-secondary-container": "#626262",
                    "surface": "#f9faf7",
                    "surface-tint": "#396759",
                    "surface-container": "#edeeec",
                    "surface-bright": "#f9faf7",
                    "outline-variant": "#c0c8c4",
                    "on-tertiary-fixed": "#33110b",
                    "inverse-surface": "#2e3130",
                    "surface-container-high": "#e7e8e6",
                    "surface-dim": "#d9dad8",
                    "on-secondary-fixed": "#1b1c1c",
                    "tertiary-fixed": "#ffdad4",
                    "on-surface": "#1a1c1b",
                    "on-primary-fixed-variant": "#204f42",
                    "outline": "#717975",
                    "primary-fixed": "#bceddc",
                    "secondary-container": "#e1dfdf",
                    "error": "#ba1a1a",
                    "tertiary": "#5d322a",
                    "secondary-fixed-dim": "#c7c6c6",
                    "surface-variant": "#e2e3e0",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f3f4f1",
                    "secondary-fixed": "#e4e2e2",
                    "on-tertiary-container": "#fbbaaf",
                    "inverse-on-surface": "#f0f1ee",
                    "primary-container": "#2f5d50",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e2e3e0",
                    "on-primary-container": "#a3d4c3",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#683a33",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "background": "#f9faf7",
                    "on-secondary-fixed-variant": "#464747",
                    "secondary": "#5e5e5e",
                    "primary-fixed-dim": "#a0d1c0",
                    "on-background": "#1a1c1b"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "base": "8px",
                    "sm": "8px",
                    "xs": "4px",
                    "md": "16px",
                    "xl": "40px",
                    "sidebar-width": "260px",
                    "2xl": "64px",
                    "lg": "24px",
                    "container-max": "1280px"
            },
            "fontFamily": {
                    "h2": ["Inter"],
                    "label-sm": ["Inter"],
                    "h1-mobile": ["Inter"],
                    "h3": ["Inter"],
                    "body-md": ["Inter"],

                    "h1-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-md": ["13px", {"lineHeight": "1", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "h4": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f9faf7; /* Matching Level 0 background */
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .auth-card {
            box-shadow: 0px 4px 20px rgba(0,0,0,0.04); /* Level 2 Overlay Shadow */
        }
        .input-focus:focus {
            outline: none;
            border-color: #154539;
            box-shadow: 0 0 0 1px #154539;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-md">
<!-- Auth Container -->
<main class="w-full max-w-[440px] animate-in fade-in duration-700">
<!-- Logo & Branding Section -->
<div class="flex flex-col items-center mb-xl">
<div class="flex items-center gap-xs mb-xs">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="font-h1 text-h1 text-primary tracking-tighter">AlmaBridge</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Secure Alumni Access Portal</p>
</div>
<!-- Login Card -->
<section class="auth-card bg-surface-container-lowest border border-outline-variant p-xl rounded-xl">
<div class="mb-lg">
<h2 class="font-h3 text-h3 text-on-surface mb-xs">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please enter your credentials to continue to the network.</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">University Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full pl-10 pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface input-focus transition-all" id="email" placeholder="alumni@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full pl-10 pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface input-focus transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device for 30 days</label>
</div>
<!-- Login Button -->
<button class="w-full mt-sm py-md bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg transition-all active:scale-[0.98] flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Social/SSO Divider (Subtle) -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="px-md bg-surface-container-lowest text-on-surface-variant uppercase tracking-widest">Or continue with</span>
</div>
</div>
<!-- SSO Options -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-[20px]">account_balance</span>
                    SSO
                </button>
<button class="flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-[20px]">work</span>
                    LinkedIn
                </button>
</div>
</section>
<!-- Footer Footer Links -->
<footer class="mt-xl flex flex-col items-center gap-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Request Access</a>
</p>
<div class="flex gap-lg">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface" href="#">Support</a>
</div>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        // Simple input focus effects beyond CSS if needed
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#154539';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '';
            });
        });
    </script>
</body></html>
